<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiSearch</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="flex">
        <h1>WikiSearch</h1>
        <form>
        <input type="search" id="search" placeholder="Search:">
        <button id="searchBut" type="button">Search</button>
       </form>
        <div class="score">
            <h4 id="level"></h4>
            <h6 id="score"></h5>
        </div>

        </div>
        <nav>
      

      </nav>
    </header>      
           <div id="searchCont">
            <div id="infoStart">
        <h3>All information sourced by Wikipedia</h3>
        <p>Every time you click a link, you will get five points, every hundred points, you get a new rank, can you find the last one?</p>
            </div>
           </div>
    <template id="card">
        <div class="card">
            <div>
                <h3 id="title"></h3>
                <p id="info"></p>
            </div>
            <img id="imag">
        </div>
    </template>
    
    <script type="module" src="main.js">
      
    </script>
</body>
</html>
